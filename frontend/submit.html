<!DOCTYPE html>
<html>
<head><title>Gap Tracker - Submit</title></head>
<body>
  <h1>Log a wrong attempt</h1>
  <input id="title" placeholder="Problem title"><br><br>
  <textarea id="statement" placeholder="Problem statement" rows="4" cols="60"></textarea><br><br>
  <textarea id="code" placeholder="Your wrong code" rows="10" cols="60"></textarea><br><br>
  <button onclick="submitAttempt()">Analyze</button>
  <p id="status"></p>

  <div id="result" style="display:none; border:1px solid #ccc; padding:1em; margin-top:1em;">
    <h3>Diagnosis</h3>
    <p><strong>Category:</strong> <span id="result-category"></span></p>
    <p><strong>Note:</strong> <span id="result-note"></span></p>
    <p><strong>Tags:</strong> <span id="result-tags"></span></p>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const token = sessionStorage.getItem("access_token");

    if (!token) {
      window.location.href = "index.html";
    }

    async function submitAttempt() {
      document.getElementById("status").innerText = "Analyzing...";
      const res = await fetch(`${API_BASE}/submissions`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`,
        },
        body: JSON.stringify({
          problem_title: document.getElementById("title").value,
          problem_statement: document.getElementById("statement").value,
          wrong_code: document.getElementById("code").value,
        }),
      });

      if (res.ok) {
        const data = await res.json();
        document.getElementById("status").innerText = "";
        document.getElementById("result-category").innerText = data.category;
        document.getElementById("result-note").innerText = data.note;
        document.getElementById("result-tags").innerText = data.topic_tags.join(", ");
        document.getElementById("result").style.display = "block";
      } else if (res.status === 401) {
        document.getElementById("status").innerText = "Session expired, please log in again.";
        sessionStorage.removeItem("access_token");
      } else {
        document.getElementById("status").innerText = "Submission failed.";
      }
    }
  </script>
</body>
</html>
