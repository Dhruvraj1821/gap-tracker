<!DOCTYPE html>
<html>
<head>
  <title>Gap Tracker — Submit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="submit.html">Log a mistake</a>
    <a href="history.html">History</a>
    <a href="dashboard.html">Patterns</a>
  </nav>

  <h1>Log a wrong attempt</h1>

  <label for="title">Problem title</label>
  <input id="title" placeholder="Two Sum">

  <label for="statement">Problem statement</label>
  <textarea id="statement" rows="3" placeholder="Given an array of integers..."></textarea>

  <label for="code">Your code</label>
  <textarea id="code" rows="10" placeholder="def solve(...):"></textarea>

  <button id="submit-btn" onclick="submitAttempt()">Analyze</button>
  <p id="status" class="status-text" style="margin-top: 1rem;"></p>

  <div id="result" class="entry status-complete" style="display:none; margin-top: 1.5rem;">
    <h2 style="font-size: 1rem; margin-bottom: 0.6rem;">Diagnosis</h2>
    <p class="entry-field"><strong>Category:</strong> <span id="result-category"></span></p>
    <p class="entry-field"><strong>Note:</strong> <span id="result-note"></span></p>
    <p class="entry-field" id="result-tags-wrap"><strong>Tags:</strong> <span id="result-tags"></span></p>
  </div>

  <script>
    const API_BASE = "https://gap-tracker.onrender.com";
    const token = sessionStorage.getItem("access_token");
    const POLL_INTERVAL_MS = 2000;
    const MAX_POLL_ATTEMPTS = 30;

    if (!token) window.location.href = "index.html";

    function setButtonDisabled(disabled) {
      document.getElementById("submit-btn").disabled = disabled;
    }

    function pollSubmission(id) {
      let attempts = 0;
      const intervalId = setInterval(async () => {
        attempts++;
        const res = await fetch(`${API_BASE}/submissions/${id}`, { headers: { "Authorization": `Bearer ${token}` } });

        if (res.status === 401) {
          clearInterval(intervalId);
          document.getElementById("status").innerText = "Your session expired. Log in again.";
          sessionStorage.removeItem("access_token");
          setButtonDisabled(false);
          return;
        }

        const data = await res.json();

        if (data.status === "complete") {
          clearInterval(intervalId);
          document.getElementById("status").innerText = "";
          document.getElementById("result-category").innerText = data.category;
          document.getElementById("result-note").innerText = data.note;
          const tags = data.topic_tags.map(t => `<span class="tag">${t}</span>`).join(" ");
          document.getElementById("result-tags").innerHTML = tags;
          document.getElementById("result").style.display = "block";
          setButtonDisabled(false);
        } else if (data.status === "failed") {
          clearInterval(intervalId);
          document.getElementById("status").innerText = "Analysis failed — try submitting again.";
          setButtonDisabled(false);
        } else if (attempts >= MAX_POLL_ATTEMPTS) {
          clearInterval(intervalId);
          document.getElementById("status").innerText = "Still processing — check History shortly.";
          setButtonDisabled(false);
        } else {
          document.getElementById("status").innerText = "Analyzing...";
        }
      }, POLL_INTERVAL_MS);
    }

    async function submitAttempt() {
      setButtonDisabled(true);
      document.getElementById("result").style.display = "none";
      document.getElementById("status").innerText = "Submitting...";

      const res = await fetch(`${API_BASE}/submissions`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({
          problem_title: document.getElementById("title").value,
          problem_statement: document.getElementById("statement").value,
          wrong_code: document.getElementById("code").value,
        }),
      });

      if (res.status === 202) {
        const data = await res.json();
        document.getElementById("status").innerText = "Analyzing...";
        pollSubmission(data.id);
      } else if (res.status === 429) {
        document.getElementById("status").innerText = "You've hit the hourly submission limit — try again later.";
        setButtonDisabled(false);
      } else if (res.status === 401) {
        document.getElementById("status").innerText = "Your session expired. Log in again.";
        sessionStorage.removeItem("access_token");
        setButtonDisabled(false);
      } else {
        document.getElementById("status").innerText = "Couldn't submit — try again.";
        setButtonDisabled(false);
      }
    }
  </script>
</body>
</html>
