<!DOCTYPE html>
<html>
<head>
  <title>Gap Tracker — Patterns</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="submit.html">Log a mistake</a>
    <a href="history.html">History</a>
    <a href="dashboard.html">Patterns</a>
  </nav>

  <h1>Your patterns</h1>

  <h2>By category</h2>
  <div id="category-bars"></div>

  <h2>By topic</h2>
  <div id="tag-bars"></div>

  <p id="status" class="status-text"></p>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const token = sessionStorage.getItem("access_token");
    if (!token) window.location.href = "index.html";

    function renderBars(containerId, counts) {
      const container = document.getElementById(containerId);
      const entries = Object.entries(counts);
      if (entries.length === 0) {
        container.innerHTML = '<p class="status-text">No data yet.</p>';
        return;
      }
      const max = Math.max(...entries.map(([, count]) => count));
      container.innerHTML = entries
        .sort((a, b) => b[1] - a[1])
        .map(([label, count]) => {
          const pct = Math.round((count / max) * 100);
          return `<div class="bar-row">
            <span class="bar-label">${label}</span>
            <span class="bar-outer"><span class="bar-inner" style="width:${pct}%">${count}</span></span>
          </div>`;
        }).join("");
    }

    async function loadPatterns() {
      const res = await fetch(`${API_BASE}/patterns`, { headers: { "Authorization": `Bearer ${token}` } });
      if (res.ok) {
        const data = await res.json();
        renderBars("category-bars", data.category_counts);
        renderBars("tag-bars", data.topic_tag_counts);
      } else if (res.status === 401) {
        document.getElementById("status").innerText = "Your session expired. Log in again.";
        sessionStorage.removeItem("access_token");
      }
    }

    loadPatterns();
  </script>
</body>
</html>
